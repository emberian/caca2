<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CACA - Cellular Automata Canvas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #0a0a0a;
            touch-action: none;
        }
        
        #canvas {
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: block;
            touch-action: none;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 1.5rem;
            text-align: center;
        }
        
        .loading::after {
            content: '';
            display: block;
            width: 40px;
            height: 40px;
            margin: 20px auto;
            border: 3px solid #333;
            border-top-color: #0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        Loading CACA...
    </div>
    <canvas id="canvas"></canvas>
    
    <script type="module">
        import init from './pkg/caca.js';
        
        async function run() {
            try {
                await init();
                document.getElementById('loading').style.display = 'none';
            } catch (e) {
                document.getElementById('loading').innerHTML = 
                    `<div style="color: #f55;">Error loading CACA</div>
                     <div style="font-size: 0.9rem; margin-top: 10px; color: #888;">
                       ${e.message}<br><br>
                       WebGPU required. Try Chrome/Edge 113+ or Firefox Nightly.
                     </div>`;
                console.error(e);
            }
        }
        
        run();
    </script>
</body>
</html>
